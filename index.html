<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Open Source Software Course - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 100%);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-100px) translateX(50px) rotate(90deg);
            }
            50% {
                transform: translateY(-50px) translateX(-30px) rotate(180deg);
            }
            75% {
                transform: translateY(-150px) translateX(20px) rotate(270deg);
            }
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #171717;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 500;
            color: #404040;
            margin-bottom: 3rem;
            min-height: 2.5rem;
        }

        .typewriter {
            display: inline-block;
            border-right: 3px solid #D4AF37;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { border-color: #D4AF37; }
            50% { border-color: transparent; }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: linear-gradient(135deg, #171717 0%, #2d2d2d 100%);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            min-width: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .countdown-number {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: #D4AF37;
            display: block;
        }

        .countdown-label {
            font-family: 'Open Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        @media (max-width: 480px) {
            .countdown {
                gap: 0.75rem;
            }
            .countdown-item {
                padding: 1rem 1.25rem;
                min-width: 70px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .particle {
                animation: none;
            }
            .typewriter {
                animation: none;
                border-right: none;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="content">
        <h1>Free Open Source Software Course</h1>
        <p class="subtitle">
            <span class="typewriter" id="typewriter"></span>
        </p>
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 80 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                container.appendChild(particle);
            }
        }
        
        createParticles();

        // Typewriter effect
        const text = "Coming Soon";
        const typewriter = document.getElementById('typewriter');
        let charIndex = 0;
        let isDeleting = false;
        let pauseAfterTyping = 2000;
        let pauseAfterDeleting = 500;

        function typeWriter() {
            if (!isDeleting) {
                typewriter.textContent = text.substring(0, charIndex + 1);
                charIndex++;
                
                if (charIndex === text.length) {
                    isDeleting = true;
                    setTimeout(typeWriter, pauseAfterTyping);
                    return;
                }
            } else {
                typewriter.textContent = text.substring(0, charIndex - 1);
                charIndex--;
                
                if (charIndex === 0) {
                    isDeleting = false;
                    setTimeout(typeWriter, pauseAfterDeleting);
                    return;
                }
            }
            
            const speed = isDeleting ? 50 : 100;
            setTimeout(typeWriter, speed);
        }

        typeWriter();

        // Countdown timer
        // April 8, 2026 21:00 UTC+1 = April 8, 2026 20:00 UTC
        const targetDate = new Date(Date.UTC(2026, 3, 8, 20, 0, 0));

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
